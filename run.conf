# compose-launcher config for SortingAlgorithms (https://github.com/Nate314/SortingAlgorithms)
# The launcher requires at least one port line, but this console program serves nothing.
# UNUSED_PORT only satisfies that rule: docker-compose.yml does not read it and publishes no ports.
port UNUSED_PORT 8080

url No web page: the container runs the sorting comparison once and exits.
url Output: .\run.ps1 logs sort   or   ./run.sh logs sort
